# Compila y publica en GitHub Pages. Se ejecuta en cada push a main y cada 6 horas
# (la ingesta RSS se hace en la compilación, así el sitio se actualiza sin commits).
name: Deploy GitHub Pages
on:
  push: { branches: [main] }
  schedule: [{ cron: '15 */6 * * *' }]
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE_PATH: /banca-del-manana/
      VITE_SITE_URL: https://negociosvv06-alt.github.io/banca-del-manana
      VITE_CONTACT_EMAIL: negociosvv06@gmail.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run ingest || echo "Ingesta con errores; se usan datos previos"
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
