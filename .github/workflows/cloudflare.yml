# Despliegue a Cloudflare Pages (proyecto "banca-del-manana").
# Requiere secretos del repo CLOUDFLARE_API_TOKEN (permiso Cloudflare Pages:Edit) y CLOUDFLARE_ACCOUNT_ID.
# Si faltan, el job se omite sin fallar.
name: Deploy Cloudflare Pages
on:
  push: { branches: [main] }
  schedule: [{ cron: '45 */6 * * *' }]
  workflow_dispatch:
permissions: { contents: read, deployments: write }
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      BASE_PATH: /
      VITE_SITE_URL: https://banca-del-manana.pages.dev
      VITE_CONTACT_EMAIL: negociosvv06@gmail.com
    steps:
      - name: Comprobar secretos
        run: |
          if [ "$HAS_CF" != "true" ]; then echo "::notice::Faltan CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID; se omite el despliegue a Cloudflare."; fi
      - if: env.HAS_CF == 'true'
        uses: actions/checkout@v4
      - if: env.HAS_CF == 'true'
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - if: env.HAS_CF == 'true'
        run: npm ci && (npm run ingest || echo "Ingesta con errores; datos previos") && npm test && npm run build
      - if: env.HAS_CF == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=banca-del-manana --branch=main
